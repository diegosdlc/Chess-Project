<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#efefeb" />
    <title>Turn Over</title>
    <link rel="stylesheet" href="./src/styles.css?v=20260814-1700" />
    <link rel="stylesheet" href="./src/home-screen.css?v=20260817-2118" />
    <link rel="stylesheet" href="./src/audio-controls.css?v=20260814-1700" />
  </head>
  <body>
    <main id="game-shell" class="board-shell" aria-label="Juego de tablero" hidden>
      <div id="board" class="board" role="grid" aria-label="Tablero de ocho por ocho"></div>
      <button id="game-settings" class="corner-settings" type="button" aria-label="Abrir ajustes" title="Ajustes">⚙</button>
    </main>

    <main id="home-screen" class="home-screen" aria-labelledby="home-title">
      <h1 id="home-title" class="visually-hidden">Turn Over</h1>
      <section class="home-stage" aria-label="Menú principal">
        <img class="home-art-layer home-background" src="./assets/menu/menu-background%20(20260817070941).webp" alt="" aria-hidden="true" />
        <img class="home-art-layer home-logo" src="./assets/menu/title-turn-over%20(20260817071053).webp" alt="" aria-hidden="true" />

        <button id="new-game" class="menu-hitbox hit-new" type="button" aria-label="Nueva partida">
          <span class="visually-hidden">Nueva partida</span>
        </button>
        <img class="home-art-layer home-button-art art-new" src="./assets/menu/btn-new-game%20(20260817071132).webp" alt="" aria-hidden="true" />

        <button id="continue-game" class="menu-hitbox hit-continue" type="button" aria-label="Continuar partida">
          <span class="visually-hidden">Continuar partida</span>
        </button>
        <img class="home-art-layer home-button-art art-continue" src="./assets/menu/btn-continue%20(20260817071201).webp" alt="" aria-hidden="true" />

        <button id="home-settings" class="menu-hitbox hit-settings" type="button" aria-label="Ajustes">
          <span class="visually-hidden">Ajustes</span>
        </button>
        <img class="home-art-layer home-button-art art-settings" src="./assets/menu/btn-settings%20(20260817071231).webp" alt="" aria-hidden="true" />
      </section>
    </main>

    <div class="audio-control">
      <button id="audio-menu-toggle" class="audio-menu-toggle" type="button" aria-label="Abrir control de volumen" aria-expanded="false" aria-controls="audio-menu">♪</button>
      <div id="audio-menu" class="audio-menu" hidden>
        <label for="music-volume">Música</label>
        <input id="music-volume" type="range" min="0" max="100" step="1" value="45" aria-label="Volumen de la música" />
        <output id="music-volume-value" for="music-volume">45%</output>
      </div>
    </div>

    <dialog id="result-dialog" class="result-dialog">
      <div id="result-content"></div>
    </dialog>

    <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
      <section class="modal-card settings-card">
        <button id="close-settings" class="dialog-close" type="button" aria-label="Cerrar ajustes">×</button>
        <p class="eyebrow">Opciones</p>
        <h2 id="settings-title">Ajustes</h2>
        <div class="settings-list">
          <div><span>Música</span><strong>Próximamente</strong></div>
          <div><span>Dificultad</span><strong>Próximamente</strong></div>
          <div><span>Controles</span><strong>Próximamente</strong></div>
        </div>
      </section>
    </dialog>

    <script type="module" src="./src/main.js?v=20260814-1700"></script>
  </body>
</html>
